# Milestone 0: laf-base / laf-gfx / laf-os(noneスタブ) が
# Emscriptenでconfigure & buildできるかだけを確認するスモークテスト。
# Skiaにはまだ触れない。ここが通らないと先に進む意味がないので最初のゲート。
#
# laf/os の Emscripten対応パッチは submodule (zixiang0623/laf の
# wasm-milestone0 ブランチ) 側に既に取り込み済みなので、ここでは
# 適用不要。

name: wasm-milestone0

on:
  workflow_dispatch:
  push:
    paths:
      - 'laf'
      - 'laf/**'
      - 'third_party/pixman'
      - '.github/workflows/wasm-milestone0.yml'

jobs:
  laf-base-gfx-os-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout aseprite (with laf + pixman submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Emscripten SDK
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest

      - name: Build Pixman for wasm
        run: |
          set -e
          cd third_party/pixman
          emconfigure ./autogen.sh \
            --disable-shared --enable-static \
            --disable-gtk --disable-libpng --disable-openmp
          emmake make -j"$(nproc)"
          echo "PIXMAN_LIB=$(pwd)/pixman/.libs/libpixman-1.a" >> "$GITHUB_ENV"
          echo "PIXMAN_INC=$(pwd)/pixman" >> "$GITHUB_ENV"

      - name: Configure laf (LAF_BACKEND=none, Pixman for gfx::Region, no Skia yet)
        run: |
          cd laf
          mkdir build-wasm
          cd build-wasm
          emcmake cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DLAF_BACKEND=none \
            -DLAF_WITH_TESTS=OFF \
            -DLAF_WITH_EXAMPLES=OFF \
            -DLAF_WITH_CLIP=ON \
            -DPIXMAN_LIBRARY="${PIXMAN_LIB}" \
            -DPIXMAN_INCLUDE_DIR="${PIXMAN_INC}"

      - name: Build laf-base + laf-gfx + laf-os + smoketest
        run: |
          cd laf/build-wasm
          set -o pipefail
          emmake cmake --build . --target laf-base laf-gfx laf-os laf-wasm-smoketest -- -j"$(nproc)" 2>&1 | tee /tmp/build.log

      - name: List smoketest build output
        run: |
          find laf/build-wasm/os -maxdepth 1 -iname "laf-wasm-smoketest*" | while read -r f; do
            echo "::notice::found: $f ($(stat -c%s "$f") bytes)"
          done

      - name: Write a minimal HTML shell (emcc's SUFFIX=.html isn't kicking in)
        run: |
          cat > laf/build-wasm/os/index.html <<'EOF'
          <!doctype html>
          <html>
          <head><meta charset="utf-8"><title>aseprite-wasm milestone 1</title></head>
          <body>
            <canvas id="canvas" width="400" height="300"></canvas>
            <script>
              var Module = { canvas: document.getElementById('canvas') };
            </script>
            <script src="laf-wasm-smoketest.js"></script>
          </body>
          </html>
          EOF

      - name: Upload smoketest (html/js/wasm) for manual verification
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: laf-wasm-smoketest
          path: |
            laf/build-wasm/os/index.html
            laf/build-wasm/os/laf-wasm-smoketest*
          if-no-files-found: warn

      - name: Surface errors as annotations
        if: failure()
        run: |
          grep -iE "error|undefined reference|fatal" /tmp/build.log | head -50 | while IFS= read -r line; do
            echo "::error::${line}"
          done

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: wasm-milestone0-build-log
          path: /tmp/build.log

  # Milestone 5: does Aseprite's own top-level CMakeLists.txt even
  # configure under Emscripten? This is a much bigger dependency
  # graph than laf alone (zlib/libpng/giflib/tinyxml2/TinyEXIF/
  # simpleini/fmt/cmark/json11/libarchive + all of src/), so this
  # job is expected to take a few iterations to go green. curl is
  # avoided entirely (ENABLE_NEWS/UPDATER/DRM=OFF => REQUIRE_CURL
  # stays OFF), webp/scripting/tests are deferred to shrink the
  # first attempt's surface area. Not building the aseprite exe
  # target yet -- just trying to get everything up to src/ to
  # configure and compile.
  aseprite-emscripten-configure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout aseprite (all submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Emscripten SDK
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest

      - name: Install native deps (for the host 'gen' tool's configure pass)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            libpixman-1-dev libfreetype6-dev libharfbuzz-dev zlib1g-dev \
            libx11-dev libxcursor-dev libxi-dev libxrandr-dev libgl1-mesa-dev \
            libfontconfig1-dev

      - name: Build native 'gen' tool
        # gen (src/gen) only needs laf-base + cfg-lib + tinyxml2 --
        # no laf-os/gfx/text -- but CMake still configures the whole
        # tree first, so this needs a real native toolchain present.
        # It has to be a native binary since it runs *during* the
        # wasm build (to turn data/*.xml into generated headers);
        # a wasm build of it wouldn't be directly executable here.
        run: |
          mkdir build-host-tools
          cd build-host-tools
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DLAF_BACKEND=none \
            -DLAF_WITH_TESTS=OFF \
            -DLAF_WITH_EXAMPLES=OFF \
            -DLAF_WITH_CLIP=ON \
            -DENABLE_NEWS=OFF \
            -DENABLE_UPDATER=OFF \
            -DENABLE_DRM=OFF \
            -DENABLE_WEBP=OFF \
            -DENABLE_SCRIPTING=OFF \
            -DENABLE_TESTS=OFF \
            -DENABLE_BENCHMARKS=OFF \
            -DENABLE_ASEPRITE_EXE=OFF \
            -DENABLE_CCACHE=OFF
          cmake --build . --target gen -- -j"$(nproc)"
          echo "GEN_EXE_PATH=$(pwd)/bin/gen" >> "$GITHUB_ENV"

      - name: Configure Aseprite for wasm
        run: |
          mkdir build-wasm
          cd build-wasm
          emcmake cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DLAF_BACKEND=none \
            -DLAF_WITH_TESTS=OFF \
            -DLAF_WITH_EXAMPLES=OFF \
            -DLAF_WITH_CLIP=ON \
            -DENABLE_NEWS=OFF \
            -DENABLE_UPDATER=OFF \
            -DENABLE_DRM=OFF \
            -DENABLE_WEBP=OFF \
            -DENABLE_SCRIPTING=OFF \
            -DENABLE_TESTS=OFF \
            -DENABLE_BENCHMARKS=OFF \
            -DENABLE_ASEPRITE_EXE=ON \
            -DENABLE_CCACHE=OFF \
            -DGEN_EXE="${GEN_EXE_PATH}" \
            -DCMAKE_CXX_FLAGS="-fexceptions" \
            -DLAF_BACKEND_LINK_FLAGS="-sUSE_SDL=2 -sALLOW_MEMORY_GROWTH=1 -sEXIT_RUNTIME=0 -sASYNCIFY=1 -sSINGLE_FILE=1 -sASSERTIONS=1 -sSTACK_OVERFLOW_CHECK=2 -sDISABLE_EXCEPTION_CATCHING=0" \
            2>&1 | tee /tmp/configure.log

      - name: Try building the aseprite executable
        if: success()
        run: |
          cd build-wasm
          set -o pipefail
          emmake cmake --build . --target aseprite -- -j"$(nproc)" 2>&1 | tee /tmp/build.log

      - name: List aseprite build output
        if: success()
        run: |
          find build-wasm/bin -maxdepth 1 -iname "aseprite*" | while read -r f; do
            echo "::notice::found: $f ($(stat -c%s "$f") bytes)"
          done

      - name: Verify data/ was actually embedded into aseprite.js
        if: success()
        run: |
          JS=build-wasm/bin/aseprite.js
          echo "::notice::aseprite.js size: $(stat -c%s "$JS") bytes"
          echo "::notice::local data/ stats: $(du -sh data | cut -f1), $(find data -type f | wc -l) files"

          GUI_COUNT=$(grep -o 'gui\.xml' "$JS" | wc -l)
          XML_COUNT=$(grep -o '\.xml' "$JS" | wc -l)
          echo "::notice::occurrences of 'gui.xml': $GUI_COUNT, '.xml' (any): $XML_COUNT"

          CREATE_CALLS=$(grep -oE 'FS_createPath|createPreloadedFile|createDataFile|preloadedFiles|preloadPlugins|PACKAGE_UUID|filePackagePrefixURL' "$JS" | sort | uniq -c | tr '\n' ';')
          echo "::notice::FS/packager related token counts: $CREATE_CALLS"

          # Search for the *raw bytes* of gui.xml's header, in case it's
          # embedded without a readable filename manifest.
          B64=$(head -c 30 data/gui.xml | base64 | tr -d '\n')
          B64_COUNT=$(grep -c -- "$B64" "$JS" || true)
          echo "::notice::base64('<?xml version=\"1.0\" ...') ($B64) occurrences: $B64_COUNT"

          # Same header as a JS decimal byte array, e.g. "60,63,120,109,108"
          BYTES=$(head -c 12 data/gui.xml | od -An -tu1 | tr -s ' ' ',' | sed 's/^,//;s/,$//')
          BYTES_COUNT=$(grep -c -- "$BYTES" "$JS" || true)
          echo "::notice::decimal byte array ($BYTES) occurrences: $BYTES_COUNT"

          LINKTXT=$(find build-wasm -name "link.txt" -path "*aseprite.dir*" | head -1)
          if [ -n "$LINKTXT" ]; then
            SNIPPET=$(grep -oE -- '--embed-file [^ ]+' "$LINKTXT" | head -3 | tr '\n' '|')
            echo "::notice::--embed-file argument(s) in link.txt: [$SNIPPET]"
          fi

          echo "::notice::--- build.log embed/packager related lines ---"
          grep -iE "embed|packager|preload" /tmp/build.log 2>/dev/null | head -20 | while IFS= read -r line; do
            echo "::warning::buildlog: ${line}"
          done

          OFF=$(grep -ob 'gui\.xml' "$JS" | head -1 | cut -d: -f1)
          if [ -z "$OFF" ]; then
            echo "::error::gui.xml string not found anywhere in aseprite.js -- data/ was not embedded as expected"
          fi

      - name: Write a minimal HTML shell
        if: success()
        run: |
          cat > build-wasm/bin/index.html <<'EOF'
          <!doctype html>
          <html>
          <head><meta charset="utf-8"><title>Aseprite wasm milestone 6</title></head>
          <body style="margin:0">
            <canvas id="canvas" width="960" height="640"></canvas>
            <script>
              var Module = { canvas: document.getElementById('canvas') };
            </script>
            <script src="aseprite.js"></script>
          </body>
          </html>
          EOF

      - name: Upload aseprite (html/js, SINGLE_FILE=1) for manual verification
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: aseprite-wasm
          path: |
            build-wasm/bin/index.html
            build-wasm/bin/aseprite*
          if-no-files-found: warn

      - name: Surface configure errors as annotations
        if: failure()
        run: |
          grep -iE "error|not found|could not|fatal" /tmp/configure.log 2>/dev/null | head -80 | while IFS= read -r line; do
            echo "::error::${line}"
          done

      - name: Surface build errors as annotations
        if: failure()
        run: |
          grep -iE "error|undefined reference|fatal" /tmp/build.log 2>/dev/null | head -80 | while IFS= read -r line; do
            echo "::error::${line}"
          done

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aseprite-emscripten-configure-logs
          path: |
            /tmp/configure.log
            /tmp/build.log
          if-no-files-found: warn
